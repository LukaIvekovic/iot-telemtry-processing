services:

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: iot_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iot_telemetry"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ingestion-service:
    build: ./services/ingestion-service
    ports:
      - "8081:8081"
    environment:
      MQTT_BROKER: tcp://mosquitto:1883
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iot_telemetry
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: on-failure

  alerting-service:
    build: ./services/alerting-service
    ports:
      - "8082:8082"
    environment:
      MQTT_BROKER: tcp://mosquitto:1883
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iot_telemetry
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      ALERTING_WEBHOOK_URL: http://webhook-mock:9000/alert
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: on-failure

  webhook-mock:
    image: mendhak/http-https-echo:latest
    ports:
      - "9000:9000"
    environment:
      HTTP_PORT: "9000"
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
  postgres-data:
